name: Laravel CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait MySQL
        run: |
          until docker compose exec -T mysql mysqladmin ping -uroot -proot --silent; do
            echo "Waiting MySQL..."
            sleep 2
          done

      - name: Install dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist

      - name: Create .env
        run: |
          docker compose exec -T app sh -c '
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
          '

      - name: Generate APP_KEY
        run: docker compose exec -T app php artisan key:generate

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T app php artisan test

      - name: Stop containers
        if: always()
        run: docker compose down